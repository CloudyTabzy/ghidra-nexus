[project]
name = "ghidra-nexus"
version = "0.3.0"
description = "Agent-first Ghidra MCP server with a persistent notebook — built for long-horizon reverse engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.1",
    "click-option-group>=0.5.9",
    "mcp[cli]>=1.26.0",
    "pyghidra>=2.2.1",
    "ghidrecomp>=0.5.8",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=4.1.0",
]
authors = [
    { name = "CloudyTabzy" },
]
keywords = [
    "security",
    "dynamic-analysis",
    "static-analysis",
    "ghidra",
    "pyghidra",
    "mcp",
    "reverse-engineering",
    "agent",
    "notebook",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
urls.Homepage = "https://github.com/CloudyTabzy/ghidra-nexus"
urls.Issues = "https://github.com/CloudyTabzy/ghidra-nexus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "aiohttp",
    "pytest-cov>=6.2.1",
    "ghidra-stubs>=11.3.2",
    "mcp[cli]>=1.26.0",
    "ruff>=0.11.4",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "uv>=0.8.11",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "aiohttp",
    "pytest-cov>=6.2.1",
    "ghidra-stubs>=11.3.2",
    "mcp[cli]>=1.26.0",
    "ruff>=0.11.4",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "uv>=0.8.11",
]
chromadb = [
    "chromadb>=1.3.5",
]

[project.scripts]
ghidra-nexus = "ghidra_nexus.server:main"
ghidra-nexus-cli = "ghidra_nexus.cli:main"
ghidra-nexus-proxy = "ghidra_nexus.proxy:main"

[tool.hatch.build]
include = [
    "src/ghidra_nexus",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/ghidra_nexus",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "N",
    "W",
    "C90",
    "RUF",
]
ignore = ["F821", "E402"]
# this is because of Java / Python import issues (see Jpype)
# top of file must be ignored as well


[tool.ruff.lint.isort]
known-first-party = ["ghidra_nexus"]
known-third-party = ["ghidra", "ghidrecomp", "java", "jpype"]

combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
reportMissingModuleSource = false
